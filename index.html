<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LSN Chunk Map - Multi-World</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0f0f11;--surface:#17171b;--card:#1e1e24;--border:#2a2a35;--border2:#222228;--text:#e8e8f0;--sub:#6b6b80;--muted:#3a3a48;--accent:#8b5cf6;--accent2:#7c3aed;--asoft:rgba(139,92,246,.15);--red:#f87171;--red2:#ef4444;--green:#4ade80;--orange:#fb923c;--sand:#c9934a;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;}

/* AUTH */
#auth-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.auth-logo{text-align:center;margin-bottom:24px;}
.auth-logo .brand{font-size:22px;font-weight:700;color:var(--accent);}
.auth-tabs{display:flex;background:var(--card);border-radius:9px;padding:3px;margin-bottom:20px;}
.auth-tab{flex:1;padding:7px;border-radius:7px;border:none;background:none;color:var(--sub);font-size:12px;font-weight:500;cursor:pointer;}
.auth-tab.on{background:var(--surface);color:var(--text);}
.auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.auth-field label{font-size:11px;color:var(--sub);}
.auth-field input{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 11px;outline:none;}
.auth-btn{width:100%;padding:10px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;}

/* ADMIN PANEL */
#admin-panel{position:fixed;inset:0;z-index:900;background:var(--bg);display:none;flex-direction:column;}
.admin-bar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px;}
.admin-bar .title{font-size:14px;font-weight:700;color:var(--accent);}
.admin-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;}
.admin-sec{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.admin-sec-title{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--sub);padding:12px 14px 10px;border-bottom:1px solid var(--border2);}
.user-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #1c1c24;}

/* APP LAYOUT */
#app{display:none;height:100%;position:relative;}
#layout{display:flex;height:100%;}
#side{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10;}
#side-scroll{flex:1;overflow-y:auto;padding:14px 12px;}
.s-lbl{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--sub);margin-bottom:9px;letter-spacing:1px;}
.field{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;margin-bottom:8px;outline:none;}
.btn{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;margin-bottom:5px;display:flex;align-items:center;gap:8px;font-size:12px;}
.btn.accent{background:var(--accent);border:none;color:white;justify-content:center;}

/* MAP */
#map-el{flex:1;position:relative;background:var(--bg);cursor:grab;overflow:hidden;touch-action:none;}
#cv-el{position:absolute;inset:0;image-rendering:pixelated;}
.hchip{position:absolute;bottom:20px;left:20px;background:rgba(0,0,0,0.5);padding:5px 10px;border-radius:5px;font-size:11px;z-index:5;}
#user-chip{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(15,15,17,.8);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:8px;padding:6px 12px;display:flex;gap:10px;align-items:center;}
.swatches{display:flex;gap:5px;margin-bottom:10px;}
.sw{width:20px;height:20px;border-radius:4px;cursor:pointer;border:2px solid transparent;}
.sw.on{border-color:white;}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo"><div class="brand">LSN Chunk Map</div></div>
    <div class="auth-tabs">
      <button class="auth-tab on" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-reg" onclick="switchTab('register')">Register</button>
    </div>
    <div id="form-login">
      <div class="auth-field"><label>Username</label><input id="l-user" type="text"></div>
      <div class="auth-field"><label>Password</label><input id="l-pass" type="password"></div>
      <button class="auth-btn" onclick="doLogin()">Login</button>
    </div>
    <div id="form-reg" style="display:none">
      <div class="auth-field"><label>Username</label><input id="r-user" type="text"></div>
      <div class="auth-field"><label>Password</label><input id="r-pass" type="password"></div>
      <button class="auth-btn" onclick="doRegister()">Request Access</button>
    </div>
  </div>
</div>

<div id="admin-panel">
  <div class="admin-bar">
    <span class="title">Admin Panel</span><div style="flex:1"></div>
    <button class="btn" onclick="closeAdmin()">Back</button>
  </div>
  <div class="admin-body">
    <div class="admin-sec"><div class="admin-sec-title">Users</div><div id="admin-users"></div></div>
  </div>
</div>

<div id="app">
  <div id="user-chip">
    <span id="uc-name">—</span>
    <span id="map-indicator" style="font-size:10px; color:var(--sub)">(Your Map)</span>
    <button id="uc-admin-btn" style="display:none; color:var(--accent)" onclick="openAdmin()">Admin</button>
    <button onclick="location.reload()">Logout</button>
  </div>
  <div id="layout">
    <div id="side">
      <div id="side-scroll">
        <div class="s-lbl">Invite People</div>
        <input id="inviteUser" class="field" placeholder="Username to invite">
        <button class="btn accent" onclick="sendInvite()">Invite to My Map</button>

        <div style="margin-top:20px">
          <div class="s-lbl">Accessible Maps</div>
          <div id="map-list">
             </div>
        </div>

        <div style="margin-top:20px">
          <div class="s-lbl">Add Base</div>
          <input id="baseName" class="field" placeholder="Base Name">
          <div class="swatches" id="swatches"></div>
          <button class="btn accent" onclick="addBase()">Add to Current Map</button>
        </div>
      </div>
    </div>
    <div id="map-el">
      <canvas id="cv-el"></canvas>
      <div class="hchip">X: <span id="hx">0</span> Z: <span id="hz">0</span></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCkcS23tW3hvcdCSCpBOy30EQVMxqYXEJQ",
  authDomain: "lsn-map.firebaseapp.com",
  projectId: "lsn-map",
  storageBucket: "lsn-map.firebasestorage.app",
  messagingSenderId: "520317481803",
  appId: "1:520317481803:web:ffcc027fd3be1984b22ece"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// STATE
let currentUser = null;
let currentMapOwner = null; // Whose map we are looking at
let BASES = [];
let panX = window.innerWidth/2, panY = window.innerHeight/2, scale = 2;
let selColor = '#8b5cf6';
const TILE = 16;

const CV = document.getElementById('cv-el');
const CTX = CV.getContext('2d');

// --- MAP ENGINE ---
function draw() {
  CV.width = window.innerWidth;
  CV.height = window.innerHeight;
  CTX.clearRect(0,0,CV.width, CV.height);
  const ts = TILE * scale;

  // Grid
  CTX.strokeStyle = '#1a1a20';
  for(let x=panX%ts; x<CV.width; x+=ts) { CTX.beginPath(); CTX.moveTo(x,0); CTX.lineTo(x,CV.height); CTX.stroke(); }
  for(let y=panY%ts; y<CV.height; y+=ts) { CTX.beginPath(); CTX.moveTo(0,y); CTX.lineTo(CV.width,y); CTX.stroke(); }

  // Bases
  BASES.forEach(b => {
    CTX.fillStyle = b.color;
    b.chunks?.forEach(c => {
      CTX.fillRect(panX + c.x*ts, panY + c.z*ts, ts, ts);
    });
  });
  requestAnimationFrame(draw);
}

// --- CORE LOGIC ---
async function switchMap(ownerId, ownerName) {
  currentMapOwner = ownerId;
  document.getElementById('map-indicator').textContent = ownerId === currentUser.uid ? "(Your Map)" : `(${ownerName}'s Map)`;
  
  // Listen to the specific owner's map data
  db.collection('maps').doc(ownerId).collection('bases').onSnapshot(snap => {
    BASES = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
  });
}

async function addBase() {
  const name = document.getElementById('baseName').value;
  if(!name) return;
  await db.collection('maps').doc(currentMapOwner).collection('bases').add({
    name, color: selColor, chunks: [{x:0, z:0}] 
  });
  document.getElementById('baseName').value = "";
}

async function sendInvite() {
  const targetName = document.getElementById('inviteUser').value;
  const snap = await db.collection('users').where('username', '==', targetName).get();
  if(snap.empty) return alert("User not found");
  
  const targetId = snap.docs[0].id;
  await db.collection('users').doc(targetId).update({
    invites: firebase.firestore.FieldValue.arrayUnion({id: currentUser.uid, name: currentUser.username})
  });
  alert("Invited!");
}

// --- AUTH & INIT ---
async function doLogin() {
  const user = document.getElementById('l-user').value;
  // This is a simplified login for your preview. In production, use Firebase Auth email/pass.
  // We will find the user document by username
  const snap = await db.collection('users').where('username', '==', user).get();
  if(snap.empty) return alert("User not found");
  const userData = snap.docs[0].data();
  currentUser = {uid: snap.docs[0].id, ...userData};
  
  enterApp();
}

function enterApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('uc-name').textContent = currentUser.username;
  
  if(currentUser.username === 'Risk') document.getElementById('uc-admin-btn').style.display = 'block';

  // Load My Map by default
  switchMap(currentUser.uid, currentUser.username);
  
  // Render Accessible Maps (Invites)
  const list = document.getElementById('map-list');
  const myBtn = document.createElement('div');
  myBtn.className = "btn"; myBtn.textContent = "My Map";
  myBtn.onclick = () => switchMap(currentUser.uid, currentUser.username);
  list.appendChild(myBtn);

  currentUser.invites?.forEach(inv => {
    const btn = document.createElement('div');
    btn.className = "btn"; btn.textContent = `${inv.name}'s Map`;
    btn.onclick = () => switchMap(inv.id, inv.name);
    list.appendChild(btn);
  });

  requestAnimationFrame(draw);
}

// UI Helpers
function switchTab(t) {
  document.getElementById('form-login').style.display = t === 'login' ? '' : 'none';
  document.getElementById('form-reg').style.display = t === 'register' ? '' : 'none';
}

// Pan controls
let isDragging = false; let startX, startY;
CV.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY; });
window.addEventListener('mousemove', e => {
  if(isDragging) { panX = e.clientX - startX; panY = e.clientY - startY; }
  const rect = CV.getBoundingClientRect();
  document.getElementById('hx').textContent = Math.floor((e.clientX - rect.left - panX) / (TILE*scale)) * 16;
  document.getElementById('hz').textContent = Math.floor((e.clientY - rect.top - panY) / (TILE*scale)) * 16;
});
window.addEventListener('mouseup', () => isDragging = false);

// Init Swatches
const colors = ['#8b5cf6','#ef4444','#4ade80','#fb923c','#c9934a'];
colors.forEach(c => {
  const s = document.createElement('div');
  s.className = 'sw'; s.style.background = c;
  s.onclick = () => { selColor = c; document.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); s.classList.add('on'); };
  document.getElementById('swatches').appendChild(s);
});

</script>
</body>
</html>
