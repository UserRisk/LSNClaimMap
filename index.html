<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LSN Chunk Map</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0f0f11;--surface:#17171b;--card:#1e1e24;--border:#2a2a35;--border2:#222228;--text:#e8e8f0;--sub:#6b6b80;--muted:#3a3a48;--accent:#8b5cf6;--accent2:#7c3aed;--asoft:rgba(139,92,246,.15);--red:#f87171;--red2:#ef4444;--green:#4ade80;--orange:#fb923c;--sand:#c9934a;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;}

/* AUTH */
#auth-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.auth-logo{text-align:center;margin-bottom:24px;}
.auth-logo .brand{font-size:22px;font-weight:700;color:var(--accent);}
.auth-logo .sub{font-size:11px;color:var(--sub);margin-top:4px;}
.auth-tabs{display:flex;background:var(--card);border-radius:9px;padding:3px;margin-bottom:20px;}
.auth-tab{flex:1;padding:7px;border-radius:7px;border:none;background:none;color:var(--sub);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;}
.auth-tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3);}
.auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.auth-field label{font-size:11px;color:var(--sub);font-weight:500;}
.auth-field input{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:9px 11px;outline:none;transition:border-color .15s;}
.auth-field input:focus{border-color:var(--accent);}
.auth-field input::placeholder{color:var(--muted);}
.auth-btn{width:100%;padding:10px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px;transition:background .12s;}
.auth-btn:hover{background:var(--accent2);}
.auth-msg{margin-top:12px;padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.6;text-align:center;}
.auth-msg.err{background:#200f0f;border:1px solid #3a1818;color:var(--red);}
.auth-msg.ok{background:#0f2010;border:1px solid #1a3a1a;color:var(--green);}
.auth-msg.warn{background:#1f1508;border:1px solid #3a2510;color:var(--orange);}

/* ADMIN */
#admin-panel{position:fixed;inset:0;z-index:900;background:var(--bg);display:none;flex-direction:column;}
.admin-bar{height:52px;min-height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px;flex-shrink:0;}
.admin-bar .title{font-size:14px;font-weight:700;color:var(--accent);}
.admin-bar .sp{flex:1;}
.admin-bar button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;cursor:pointer;transition:all .1s;}
.admin-bar button:hover{border-color:var(--accent);color:var(--accent);}
.admin-bar button.danger{border-color:#3a1818;color:var(--red);}
.admin-bar button.danger:hover{background:#1e1010;}
.admin-body{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px;}
.admin-sec{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.admin-sec-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);padding:12px 14px 10px;border-bottom:1px solid var(--border2);}
.user-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #1c1c24;}
.user-row:last-child{border-bottom:none;}
.u-av{width:32px;height:32px;border-radius:8px;background:var(--asoft);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;}
.u-info{flex:1;min-width:0;}
.u-name{font-size:13px;font-weight:600;}
.u-meta{font-size:10px;color:var(--sub);margin-top:2px;}
.u-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0;}
.bp{background:#201508;color:var(--orange);border:1px solid #3a2510;}
.ba{background:#0f2010;color:var(--green);border:1px solid #1a3a1a;}
.br-badge{background:#200f0f;color:var(--red);border:1px solid #3a1818;}
.u-acts{display:flex;gap:6px;flex-shrink:0;}
.uact{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid;cursor:pointer;font-family:inherit;background:none;transition:all .1s;}
.uact.approve{border-color:#1a3a1a;color:var(--green);}.uact.approve:hover{background:#0f2010;}
.uact.reject{border-color:#3a1818;color:var(--red);}.uact.reject:hover{background:#200f0f;}

/* APP */
#app{display:none;height:100%;position:relative;}
#user-chip{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(15,15,17,.88);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px);}
#user-chip .uc-name{color:var(--accent);}
#user-chip .uc-sep{width:1px;height:10px;background:var(--border);}
#user-chip button{color:var(--sub);cursor:pointer;font-size:10px;padding:2px 6px;border-radius:5px;border:1px solid transparent;background:none;font-family:inherit;transition:all .1s;}
#user-chip button:hover{border-color:var(--border);color:var(--text);}
#user-chip .uc-admin{border-color:var(--border)!important;color:var(--accent)!important;background:var(--asoft)!important;font-weight:600;}

/* MAP INNER */
#layout{display:flex;height:100%;overflow:hidden;}
#side{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
#side-scroll{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:20px;}
#side-scroll::-webkit-scrollbar{width:3px;}
#side-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.s-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-bottom:9px;}
.field{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:12px;padding:7px 10px;outline:none;transition:border-color .15s;margin-bottom:8px;}
.field:focus{border-color:var(--accent);}.field::placeholder{color:var(--muted);}
.swatches{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.sw{width:22px;height:22px;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:transform .1s,border-color .1s;}
.sw:hover{transform:scale(1.12);}.sw.on{border-color:#fff;}
.btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;cursor:pointer;transition:all .1s;margin-bottom:5px;}
.btn:last-child{margin-bottom:0;}.btn:hover{background:#25252d;border-color:#3a3a48;}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;justify-content:center;}.btn.accent:hover{background:var(--accent2);}
.btn.danger{color:var(--red);border-color:#3a1818;background:#1e1010;}.btn.danger:hover{background:#2a1212;border-color:#5a2020;}
.btn.ghost{color:var(--sub);border-color:transparent;background:transparent;}.btn.ghost:hover{background:var(--card);color:var(--text);border-color:var(--border);}
.brow{display:flex;align-items:center;border-radius:10px;margin-bottom:6px;border:1px solid var(--border2);overflow:hidden;cursor:pointer;background:var(--card);transition:border-color .12s,background .1s;}
.brow:hover{border-color:var(--border);}.brow.sel{border-color:var(--accent);background:#1c1828;}
.brow-strip{width:4px;flex-shrink:0;align-self:stretch;}.brow-info{flex:1;min-width:0;padding:9px;}
.brow-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px;}
.brow-pills{display:flex;gap:4px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;font-size:9px;font-weight:600;padding:2px 6px;border-radius:20px;white-space:nowrap;}
.pill.p{background:#1f1830;color:var(--accent);}.pill.g{background:#0f2218;color:var(--green);}.pill.r{background:#200f0f;color:var(--red);}.pill.a{background:#201408;color:var(--orange);}.pill.s{background:#2a1f0e;color:var(--sand);}
.brow-del{width:36px;min-height:52px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:16px;border-left:1px solid var(--border2);flex-shrink:0;transition:all .1s;}
.brow-del:hover{color:var(--red);background:#1e1010;}
.acard{border:1px solid var(--accent);border-radius:10px;overflow:hidden;background:var(--card);}
.acard-head{display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid #1f1830;background:#1a1626;}
.acard-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}.acard-name{font-size:13px;font-weight:600;flex:1;}
.acard-body{padding:10px;display:flex;flex-direction:column;gap:6px;}
.srow{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);}.srow span:last-child{font-weight:500;color:var(--text);}
.acard-act{display:flex;gap:6px;padding:0 10px 10px;}.acard-act .btn{margin-bottom:0;flex:1;justify-content:center;padding:7px;}
.empty{font-size:12px;color:var(--muted);}
#map-el{flex:1;position:relative;overflow:hidden;background:var(--bg);cursor:grab;touch-action:none;}
#map-el.no-drag{cursor:crosshair;}#map-el:active:not(.no-drag){cursor:grabbing;}
#cv-el{position:absolute;top:0;left:0;image-rendering:pixelated;}
#ring-el{position:absolute;pointer-events:none;z-index:3;border:2px solid rgba(248,113,113,.55);}
#tools-el{position:absolute;left:12px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:5px;}
#utils-el{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:5px;}
.fab{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:rgba(23,23,27,.92);backdrop-filter:blur(10px);cursor:pointer;color:var(--sub);transition:all .12s;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.35);}
.fab svg{width:19px;height:19px;}.fab:hover{background:rgba(30,30,36,.98);border-color:var(--accent);color:var(--text);}
.fab.on{background:var(--asoft);border-color:var(--accent);color:var(--accent);}.fab.sand-on{background:rgba(201,147,74,.15);border-color:var(--sand);color:var(--sand);}.fab.mark-on{background:rgba(99,102,241,.15);border-color:#6366f1;color:#6366f1;}
.fab::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:rgba(10,10,14,.95);color:var(--text);font-size:10px;font-weight:500;font-family:inherit;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;border:1px solid var(--border);}
#utils-el .fab::after{left:auto;right:calc(100% + 10px);}.fab:hover::after{opacity:1;}
#colorDot{width:18px;height:18px;border-radius:5px;border:2px solid rgba(255,255,255,.12);}
.fab-sep{height:1px;background:var(--border);margin:3px 4px;}
.hchip{position:absolute;z-index:5;background:rgba(15,15,17,.88);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--sub);pointer-events:none;backdrop-filter:blur(8px);line-height:1.8;}
.hchip span{color:var(--text);}.hchip .a{color:var(--orange);}.hchip .r{color:var(--red);}
#chip-pos{bottom:44px;left:14px;}
#chip-mode{top:52px;left:50%;transform:translateX(-50%);font-weight:500;white-space:nowrap;}
#tip-el{position:absolute;z-index:20;background:rgba(15,15,17,.94);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:11px;color:var(--sub);pointer-events:none;display:none;line-height:1.9;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4);}
#wm{position:absolute;bottom:14px;right:14px;z-index:6;display:flex;align-items:center;gap:7px;background:rgba(15,15,17,.72);border:1px solid var(--border);border-radius:8px;padding:5px 10px;pointer-events:none;backdrop-filter:blur(8px);}
#wm .wn{font-size:10px;font-weight:700;color:var(--accent);}#wm .ws{width:1px;height:11px;background:var(--border);}
#wm .wd{font-size:10px;font-weight:500;color:var(--sub);display:flex;align-items:center;gap:4px;}#wm .wd svg{width:12px;height:12px;fill:var(--sub);}
#wm .wc{font-size:9px;color:var(--muted);}
#sheet-el{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;max-height:66vh;flex-direction:column;box-shadow:0 -8px 32px rgba(0,0,0,.5);transition:transform .25s ease;}
#sh-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
#sh-tabs{display:flex;padding:8px 12px 0;flex-shrink:0;border-bottom:1px solid var(--border2);}
.tab-btn{flex:1;padding:7px 4px;font-size:11px;font-weight:500;color:var(--sub);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;transition:all .12s;text-align:center;}
.tab-btn.on{color:var(--accent);border-bottom-color:var(--accent);}
#sh-body{flex:1;overflow-y:auto;padding:12px;}#sh-body::-webkit-scrollbar{display:none;}
#ov-el{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);align-items:center;justify-content:center;}
#ov-el.show{display:flex;}
#mod-el{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;width:340px;max-width:90vw;box-shadow:0 16px 48px rgba(0,0,0,.6);}
#mod-el h3{font-size:15px;font-weight:700;margin-bottom:5px;color:var(--text);}
#mod-el .msub{font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.6;}
.code-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:monospace;font-size:10px;color:var(--accent);word-break:break-all;line-height:1.6;margin-bottom:12px;user-select:all;cursor:text;max-height:110px;overflow-y:auto;}
textarea.code-box{width:100%;resize:none;outline:none;color:var(--text);height:80px;font-size:10px;}textarea.code-box.err{border-color:var(--red2);}
.modal-row{display:flex;gap:8px;}.modal-row .btn{margin-bottom:0;}
.epick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
.epick button{width:36px;height:36px;border-radius:8px;font-size:19px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;}
.epick button:hover{border-color:var(--accent);}.epick button.on{border-color:var(--accent);background:var(--asoft);}
@media(max-width:640px){
  #side{display:none;}#sheet-el{display:flex;}#chip-mode{display:none;}
  #tools-el{top:auto;bottom:78px;transform:none;}#utils-el{top:auto;bottom:78px;transform:none;}
  #wm{display:none;}#chip-pos{bottom:78px;}
}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="brand">LSN Chunk Map</div>
      <div class="sub">by Risk · r1skx</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab on" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-reg" onclick="switchTab('register')">Register</button>
    </div>
    <div id="form-login">
      <div class="auth-field"><label>Username (Email)</label><input id="l-user" type="email" placeholder="email@example.com" autocomplete="username"></div>
      <div class="auth-field"><label>Password</label><input id="l-pass" type="password" placeholder="password" autocomplete="current-password"></div>
      <button class="auth-btn" onclick="doLogin()">Login</button>
    </div>
    <div id="form-reg" style="display:none">
      <div class="auth-field"><label>Username (Email)</label><input id="r-user" type="email" placeholder="email@example.com" autocomplete="username"></div>
      <div class="auth-field"><label>Password</label><input id="r-pass" type="password" placeholder="password" autocomplete="new-password"></div>
      <div class="auth-field"><label>Confirm Password</label><input id="r-pass2" type="password" placeholder="repeat password" autocomplete="new-password"></div>
      <button class="auth-btn" onclick="doRegister()">Request Access</button>
    </div>
    <div id="auth-msg" style="display:none"></div>
  </div>
</div>

<div id="admin-panel">
  <div class="admin-bar">
    <span class="title">Admin Panel</span><span class="sp"></span>
    <button onclick="closeAdmin()">Back to Map</button>
    <button class="danger" onclick="doLogout()">Logout</button>
  </div>
  <div class="admin-body">
    <div class="admin-sec">
      <div class="admin-sec-title">Pending Requests</div>
      <div id="pending-list"></div>
    </div>
    <div class="admin-sec">
      <div class="admin-sec-title">All Users</div>
      <div id="all-users-list"></div>
    </div>
  </div>
</div>

<div id="app">
  <div id="user-chip">
    <svg width="12" height="12" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="4" stroke="var(--accent)" stroke-width="1.6"/><path d="M3 18c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span class="uc-name" id="uc-name">—</span>
    <div class="uc-sep"></div>
    <button id="uc-admin-btn" onclick="openAdminPanel()" style="display:none" class="uc-admin">Admin</button>
    <button onclick="doLogout()">Logout</button>
  </div>

  <div id="layout">
    <div id="side">
      <div id="side-scroll">
        <div>
          <div class="s-lbl">New Base</div>
          <input id="nameIn" class="field" type="text" placeholder="Base name" maxlength="16">
          <div class="swatches" id="d-sw"></div>
          <button class="btn accent" onclick="startChest()">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M2 4h12v2H2zM2 7h12v7H2z"/><rect x="6" y="9" width="4" height="2.5" rx=".5" fill="rgba(0,0,0,.3)"/></svg>
            Place Claim Chest
          </button>
        </div>
        <div id="d-active" style="display:none"><div class="s-lbl">Active Base</div><div id="d-acard"></div></div>
        <div><div class="s-lbl">Bases</div><div id="d-list"><div class="empty">No bases yet</div></div></div>
        <div>
          <div class="s-lbl">Save &amp; Load</div>
          <button class="btn" onclick="doExport()"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M8 1v9M4 7l4 4 4-4M2 13h12" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg>Export code</button>
          <button class="btn" onclick="openImport()"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M8 12V3M4 6l4-4 4 4M2 13h12" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg>Import code</button>
        </div>
      </div>
    </div>

    <div id="map-el">
      <canvas id="cv-el"></canvas>
      <div id="ring-el"></div>
      <div id="tools-el">
        <button class="fab on" id="fbPan" onclick="setTool('pan')" data-tip="Pan"><svg viewBox="0 0 20 20" fill="none"><path d="M10 2v2M10 16v2M2 10h2M16 10h2M5.05 5.05l1.41 1.41M13.54 13.54l1.41 1.41M5.05 14.95l1.41-1.41M13.54 6.46l1.41-1.41M10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button class="fab" id="fbPlace" onclick="onFbPlace()" data-tip="Place Chest"><svg viewBox="0 0 20 20" fill="none"><rect x="2" y="8" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="5" width="16" height="4" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="8" y="10" width="4" height="3" rx="1" fill="currentColor"/></svg></button>
        <button class="fab" id="fbEdit" onclick="setTool('edit')" data-tip="Edit: L=claim R=remove"><svg viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity=".4"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity=".7"/></svg></button>
        <div class="fab-sep"></div>

<script>
// REPLACE WITH YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ═══ AUTH UI LOGIC ════════════════════════════════════
let curTab = 'login';
const ADMIN_EMAIL = "your-admin-email@gmail.com"; // Set your admin email here

function switchTab(t) {
  curTab = t;
  document.getElementById('tab-login').classList.toggle('on', t === 'login');
  document.getElementById('tab-reg').classList.toggle('on', t === 'register');
  document.getElementById('form-login').style.display = t === 'login' ? '' : 'none';
  document.getElementById('form-reg').style.display = t === 'register' ? '' : 'none';
  clearMsg();
}

function showMsg(txt, type = 'err') {
  const e = document.getElementById('auth-msg');
  e.style.display = '';
  e.className = 'auth-msg ' + type;
  e.innerHTML = txt;
}

function clearMsg() {
  const e = document.getElementById('auth-msg');
  e.style.display = 'none';
  e.textContent = '';
}

// ═══ FIREBASE AUTH FUNCTIONS ══════════════════════════
async function doLogin() {
  const email = document.getElementById('l-user').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (!email || !pass) { showMsg('Fill in all fields.'); return; }

  try {
    const userCredential = await auth.signInWithEmailAndPassword(email, pass);
    const user = userCredential.user;
    
    // Check approval status in Firestore
    const userDoc = await db.collection('users').doc(user.uid).get();
    const userData = userDoc.data();

    if (email === ADMIN_EMAIL || (userData && userData.status === 'approved')) {
      enterApp(userData ? userData.username : "Admin", email === ADMIN_EMAIL ? 'admin' : 'user');
    } else {
      showMsg('Your account is pending approval.', 'warn');
      auth.signOut();
    }
  } catch (error) {
    showMsg(error.message);
  }
}

async function doRegister() {
  const email = document.getElementById('r-user').value.trim();
  const pass = document.getElementById('r-pass').value;
  const pass2 = document.getElementById('r-pass2').value;

  if (!email || !pass || !pass2) { showMsg('Fill in all fields.'); return; }
  if (pass !== pass2) { showMsg('Passwords do not match.'); return; }

  try {
    const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
    const user = userCredential.user;

    // Save to pending list in Firestore
    await db.collection('users').doc(user.uid).set({
      email: email,
      username: email.split('@')[0],
      status: 'pending',
      role: 'user',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    showMsg('Request sent! Wait for Risk to approve you.', 'ok');
    auth.signOut();
  } catch (error) {
    showMsg(error.message);
  }
}

function enterApp(name, role) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('uc-name').textContent = name;
  if (role === 'admin') document.getElementById('uc-admin-btn').style.display = 'block';
  
  // Start syncing map data from Firebase
  syncData();
}

function doLogout() {
  auth.signOut();
  location.reload();
}

// ═══ DATABASE SYNC (FIREBASE) ════════════════════════
function syncData() {
  // Real-time map data sync
  db.collection('map_data').doc('current').onSnapshot((doc) => {
    if (doc.exists) {
      const data = doc.data();
      // Update your map variables here (e.g., BASES = data.bases)
      // redrawMap();
    }
  });
}
