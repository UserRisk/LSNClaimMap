<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LSN Chunk Map</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:     #0f0f11;
  --surface:#17171b;
  --card:   #1e1e24;
  --border: #2a2a35;
  --border2:#222228;
  --text:   #e8e8f0;
  --sub:    #6b6b80;
  --muted:  #3a3a48;
  --accent: #8b5cf6;
  --accent2:#7c3aed;
  --asoft:  rgba(139,92,246,.15);
  --red:    #f87171;
  --red2:   #ef4444;
  --green:  #4ade80;
  --orange: #fb923c;
  --sand:   #c9934a;
  --sandbg: #2a1f0e;
  --map-bg: #ffffff;
}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;}

/* ══ LAYOUT ═══════════════════════════════════════ */
#layout{display:flex;height:100%;overflow:hidden;}

/* ══ SIDEBAR ══════════════════════════════════════ */
#side{
  width:220px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
#side-scroll{
  flex:1;overflow-y:auto;
  padding:14px 12px;
  display:flex;flex-direction:column;gap:20px;
}
#side-scroll::-webkit-scrollbar{width:3px;}
#side-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.s-lbl{
  font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--sub);margin-bottom:9px;
}

input.field{
  width:100%;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:inherit;font-size:12px;
  padding:7px 10px;outline:none;transition:border-color .15s;
  margin-bottom:8px;
}
input.field:focus{border-color:var(--accent);}
input.field::placeholder{color:var(--muted);}

.swatches{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.sw{
  width:22px;height:22px;border-radius:5px;
  cursor:pointer;border:2px solid transparent;transition:transform .1s,border-color .1s;
}
.sw:hover{transform:scale(1.12);}
.sw.on{border-color:#fff;}

.btn{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:8px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--card);
  color:var(--text);font-family:inherit;font-size:12px;
  cursor:pointer;transition:all .1s;margin-bottom:5px;
}
.btn:last-child{margin-bottom:0;}
.btn:hover{background:#25252d;border-color:#3a3a48;}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;justify-content:center;}
.btn.accent:hover{background:var(--accent2);}
.btn.danger{color:var(--red);border-color:#3a1818;background:#1e1010;}
.btn.danger:hover{background:#2a1212;border-color:#5a2020;}
.btn.ghost{color:var(--sub);border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--card);color:var(--text);border-color:var(--border);}

/* Base cards */
.brow{
  display:flex;align-items:center;
  border-radius:10px;margin-bottom:6px;
  border:1px solid var(--border2);
  overflow:hidden;cursor:pointer;
  background:var(--card);
  transition:border-color .12s,background .1s;
}
.brow:hover{border-color:var(--border);}
.brow.sel{border-color:var(--accent);background:#1c1828;}
.brow-strip{width:4px;flex-shrink:0;align-self:stretch;}
.brow-info{flex:1;min-width:0;padding:9px 9px;}
.brow-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px;}
.brow-pills{display:flex;gap:4px;flex-wrap:wrap;}
.pill{
  display:inline-flex;align-items:center;
  font-size:9px;font-weight:600;
  padding:2px 6px;border-radius:20px;
  white-space:nowrap;
}
.pill.p {background:#1f1830;color:var(--accent);}
.pill.g {background:#0f2218;color:var(--green);}
.pill.r {background:#200f0f;color:var(--red);}
.pill.a {background:#201408;color:var(--orange);}
.pill.s {background:var(--sandbg);color:var(--sand);}
.brow-del{
  width:36px;min-height:52px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;font-size:16px;
  border-left:1px solid var(--border2);flex-shrink:0;
  transition:all .1s;
}
.brow-del:hover{color:var(--red);background:#1e1010;}

/* Active base card */
.acard{border:1px solid var(--accent);border-radius:10px;overflow:hidden;background:var(--card);}
.acard-head{display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid #1f1830;background:#1a1626;}
.acard-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.acard-name{font-size:13px;font-weight:600;flex:1;}
.acard-body{padding:10px;display:flex;flex-direction:column;gap:6px;}
.srow{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);}
.srow span:last-child{font-weight:500;color:var(--text);}
.acard-act{display:flex;gap:6px;padding:0 10px 10px;}
.acard-act .btn{margin-bottom:0;flex:1;justify-content:center;padding:7px;}

.empty{font-size:12px;color:var(--muted);}

/* ══ MAP ══════════════════════════════════════════ */
#map{
  flex:1;position:relative;overflow:hidden;
  background:var(--bg);
  cursor:grab;touch-action:none;
}
#map.no-drag{cursor:crosshair;}
#map:active:not(.no-drag){cursor:grabbing;}
#cv{position:absolute;top:0;left:0;image-rendering:pixelated;}

#ring{
  position:absolute;pointer-events:none;z-index:3;
  border:2px solid rgba(248,113,113,.55);
  box-shadow:0 0 0 1px rgba(248,113,113,.15);
}

/* ══ FLOATING TOOLS ═══════════════════════════════ */
#tools{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  z-index:10;display:flex;flex-direction:column;gap:5px;
}
#utils{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  z-index:10;display:flex;flex-direction:column;gap:5px;
}

.fab{
  width:42px;height:42px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
  background:rgba(23,23,27,.92);
  backdrop-filter:blur(10px);
  cursor:pointer;color:var(--sub);
  transition:all .12s;position:relative;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.fab svg{width:19px;height:19px;}
.fab:hover{background:rgba(30,30,36,.98);border-color:var(--accent);color:var(--text);}
.fab.on{background:var(--asoft);border-color:var(--accent);color:var(--accent);}
.fab.on:hover{background:rgba(139,92,246,.22);}
.fab.sand-on{background:rgba(201,147,74,.15);border-color:var(--sand);color:var(--sand);}
.fab.mark-on{background:rgba(99,102,241,.15);border-color:#6366f1;color:#6366f1;}

/* Tooltip */
.fab::after{
  content:attr(data-tip);
  position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
  background:rgba(10,10,14,.95);color:var(--text);
  font-size:10px;font-weight:500;font-family:inherit;
  padding:4px 9px;border-radius:6px;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .15s;
  border:1px solid var(--border);
}
#utils .fab::after{left:auto;right:calc(100% + 10px);}
.fab:hover::after{opacity:1;}

#colorDot{width:18px;height:18px;border-radius:5px;border:2px solid rgba(255,255,255,.12);}

.fab-sep{height:1px;background:var(--border);margin:3px 4px;}

/* ══ HUD ══════════════════════════════════════════ */
.hchip{
  position:absolute;z-index:5;
  background:rgba(15,15,17,.88);
  border:1px solid var(--border);border-radius:8px;
  padding:5px 10px;font-size:11px;color:var(--sub);
  pointer-events:none;backdrop-filter:blur(8px);line-height:1.8;
}
.hchip span{color:var(--text);}
.hchip .a{color:var(--orange);}
.hchip .r{color:var(--red);}
.hchip .sand{color:var(--sand);}
.hchip .mark{color:#818cf8;}

#chip-pos{bottom:14px;left:14px;}
#chip-mode{
  top:14px;left:50%;transform:translateX(-50%);
  font-weight:500;white-space:nowrap;color:var(--sub);
}

/* Tooltip */
#tip{
  position:absolute;z-index:20;
  background:rgba(15,15,17,.94);border:1px solid var(--border);border-radius:8px;
  padding:8px 11px;font-size:11px;color:var(--sub);
  pointer-events:none;display:none;line-height:1.9;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}

/* ══ BOTTOM SHEET (mobile) ════════════════════════ */
#sheet{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;max-height:66vh;
  flex-direction:column;
  box-shadow:0 -8px 32px rgba(0,0,0,.5);
  transition:transform .25s ease;
}
#sh-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
#sh-tabs{display:flex;padding:8px 12px 0;flex-shrink:0;border-bottom:1px solid var(--border2);}
.tab-btn{
  flex:1;padding:7px 4px;font-size:11px;font-weight:500;
  color:var(--sub);background:none;border:none;
  border-bottom:2px solid transparent;cursor:pointer;
  font-family:inherit;transition:all .12s;text-align:center;
}
.tab-btn.on{color:var(--accent);border-bottom-color:var(--accent);}
#sh-body{flex:1;overflow-y:auto;padding:12px;}
#sh-body::-webkit-scrollbar{display:none;}

/* ══ MODAL ════════════════════════════════════════ */
#overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.6);align-items:center;justify-content:center;
}
#overlay.show{display:flex;}
#modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:22px;width:340px;max-width:90vw;
  box-shadow:0 16px 48px rgba(0,0,0,.6);
}
#modal h3{font-size:15px;font-weight:700;margin-bottom:5px;color:var(--text);}
#modal .msub{font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.6;}
.code-box{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:10px;font-family:monospace;font-size:10px;color:var(--accent);
  word-break:break-all;line-height:1.6;margin-bottom:12px;
  user-select:all;cursor:text;max-height:110px;overflow-y:auto;
}
textarea.code-box{
  width:100%;resize:none;outline:none;color:var(--text);height:80px;font-size:10px;
}
textarea.code-box.err{border-color:var(--red2);}
.modal-row{display:flex;gap:8px;}
.modal-row .btn{margin-bottom:0;}

/* emoji picker in modal */
.epick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
.epick button{
  width:36px;height:36px;border-radius:8px;font-size:19px;
  border:1.5px solid var(--border);background:var(--card);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .1s;
}
.epick button:hover{border-color:var(--accent);}
.epick button.on{border-color:var(--accent);background:var(--asoft);}

/* ══ RESPONSIVE ═══════════════════════════════════ */
@media(max-width:640px){
  #side{display:none;}
  #sheet{display:flex;}
  #chip-mode{display:none;}
  #tools{top:auto;bottom:78px;transform:none;}
  #utils{top:auto;bottom:78px;transform:none;}
}
@media(min-width:641px){
  #chip-pos{bottom:14px;left:14px;}
}
</style>
</head>
<body>
<div id="layout">

<!-- ══ SIDEBAR ══ -->
<div id="side">
  <div id="side-scroll">

    <div>
      <div class="s-lbl">New Base</div>
      <input id="nameIn" class="field" type="text" placeholder="Base name" maxlength="16">
      <div class="swatches" id="d-sw"></div>
      <button class="btn accent" onclick="startChest()">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M2 4h12v2H2zM2 7h12v7H2z"/><rect x="6" y="9" width="4" height="2.5" rx=".5" fill="rgba(0,0,0,.3)"/></svg>
        Place Claim Chest
      </button>
    </div>

    <div id="d-active" style="display:none">
      <div class="s-lbl">Active Base</div>
      <div id="d-acard"></div>
    </div>

    <div>
      <div class="s-lbl">Bases</div>
      <div id="d-list"><div class="empty">No bases yet</div></div>
    </div>

    <div>
      <div class="s-lbl">Save &amp; Load</div>
      <button class="btn" onclick="doExport()">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M8 1v9M4 7l4 4 4-4M2 13h12" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg>
        Export code
      </button>
      <button class="btn" onclick="openImport()">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M8 12V3M4 6l4-4 4 4M2 13h12" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg>
        Import code
      </button>
    </div>

  </div>
</div>

<!-- ══ MAP ══ -->
<div id="map">
  <canvas id="cv"></canvas>
  <div id="ring"></div>

  <!-- LEFT: primary tools -->
  <div id="tools">
    <!-- Pan -->
    <button class="fab on" id="fbPan" onclick="setTool('pan')" data-tip="Pan">
      <svg viewBox="0 0 20 20" fill="none"><path d="M10 2v2M10 16v2M2 10h2M16 10h2M5.05 5.05l1.41 1.41M13.54 13.54l1.41 1.41M5.05 14.95l1.41-1.41M13.54 6.46l1.41-1.41M10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <!-- Place Chest -->
    <button class="fab" id="fbPlace" onclick="onFbPlace()" data-tip="Place Chest">
      <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="8" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="5" width="16" height="4" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="8" y="10" width="4" height="3" rx="1" fill="currentColor"/></svg>
    </button>
    <!-- Edit (L=claim, R=remove) -->
    <button class="fab" id="fbEdit" onclick="setTool('edit')" data-tip="Edit: L=claim  R=remove">
      <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity=".4"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity=".7"/></svg>
    </button>
    <div class="fab-sep"></div>
    <!-- Sandwall -->
    <button class="fab" id="fbSand" onclick="setTool('sand')" data-tip="Sandwall: L=add  R=remove">
      <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="16" height="16" rx="2" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="8" x2="20" y2="8" stroke="currentColor" stroke-width="1" opacity=".5"/><line x1="2" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1" opacity=".5"/><line x1="8" y1="2" x2="8" y2="20" stroke="currentColor" stroke-width="1" opacity=".5"/><line x1="12" y1="2" x2="12" y2="20" stroke="currentColor" stroke-width="1" opacity=".5"/></svg>
    </button>
    <!-- Marker -->
    <button class="fab" id="fbMark" onclick="setTool('mark')" data-tip="Markers: L=place  R=remove">
      <svg viewBox="0 0 20 20" fill="none"><path d="M10 2a5 5 0 0 1 5 5c0 3.5-5 11-5 11S5 10.5 5 7a5 5 0 0 1 5-5z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="7.5" r="1.8" fill="currentColor"/></svg>
    </button>
  </div>

  <!-- RIGHT: utils -->
  <div id="utils">
    <button class="fab" id="fbColor" onclick="openColorPicker()" data-tip="Base color"><div id="colorDot"></div></button>
    <div class="fab-sep"></div>
    <button class="fab" onclick="doZoom(1.14)" data-tip="Zoom in">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M9 6v6M6 9h6M14 14l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="fab" onclick="doZoom(.88)" data-tip="Zoom out">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M6 9h6M14 14l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div class="fab-sep"></div>
    <button class="fab" onclick="openMore()" data-tip="More">
      <svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="4" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="10" cy="16" r="1.5"/></svg>
    </button>
  </div>

  <!-- HUD -->
  <div class="hchip" id="chip-pos">
    X&nbsp;<span id="hx">0</span>&ensp;Z&nbsp;<span id="hz">0</span><br>
    <span id="hint"></span>
  </div>
  <div class="hchip" id="chip-mode">Pan &amp; zoom</div>

  <div id="tip"></div>
</div><!-- end map -->

</div><!-- end layout -->

<!-- ══ BOTTOM SHEET (mobile) ══ -->
<div id="sheet">
  <div id="sh-handle"></div>
  <div id="sh-tabs">
    <button class="tab-btn on" onclick="showSheet('new',this)">New</button>
    <button class="tab-btn"    onclick="showSheet('active',this)">Active</button>
    <button class="tab-btn"    onclick="showSheet('bases',this)">Bases</button>
    <button class="tab-btn"    onclick="showSheet('save',this)">Save</button>
  </div>
  <div id="sh-body"></div>
</div>

<!-- ══ MODAL ══ -->
<div id="overlay">
  <div id="modal">
    <h3 id="m-title"></h3>
    <div class="msub" id="m-sub"></div>
    <div id="m-body"></div>
    <div class="modal-row">
      <button class="btn accent" id="m-ok" style="flex:1;justify-content:center"></button>
      <button class="btn ghost" onclick="closeModal()" style="width:74px;justify-content:center">Cancel</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const MAP=document.getElementById('map');

const CW=120,CH=120,TILE=7,BZONE=7;
let scale=1,panX=0,panY=0;
let dragging=false,lx=0,ly=0;
let hcx=-1,hcz=-1;
let lastDist=0,pinching=false,pmx=0,pmy=0;
let activeTool='pan';

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let bases=[],active=null,placing=null,selCol='#8b5cf6';
const sandwalls=new Set();
let markers=[];

const COLORS=['#8b5cf6','#f87171','#60a5fa','#4ade80','#fb923c','#f472b6','#34d399','#fbbf24'];
const TOOL_IDS={pan:'fbPan',place:'fbPlace',edit:'fbEdit',sand:'fbSand',mark:'fbMark'};
const MARKER_EMOJIS=['📍','⚔️','🏰','💀','⚠️','🌊','🔥','🌲','🏠','⛏️','🛡️','👁️','❌','✅','⭐','🗺️'];

// ═══════════════════════════════════════════════════
// SWATCHES
// ═══════════════════════════════════════════════════
function buildSwatches(id){
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML='';
  COLORS.forEach(c=>{
    const d=document.createElement('div');
    d.className='sw'+(c===selCol?' on':'');
    d.dataset.c=c;d.style.background=c;
    d.onclick=()=>{
      document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));
      document.querySelectorAll(`.sw[data-c="${c}"]`).forEach(x=>x.classList.add('on'));
      selCol=c;updateColorDot();
    };
    el.appendChild(d);
  });
}
buildSwatches('d-sw');
function updateColorDot(){const d=document.getElementById('colorDot');if(d)d.style.background=selCol;}
updateColorDot();

// ═══════════════════════════════════════════════════
// TOOL MANAGEMENT
// ═══════════════════════════════════════════════════
function setTool(t){
  activeTool=t;
  Object.entries(TOOL_IDS).forEach(([k,id])=>{
    const el=document.getElementById(id);if(!el)return;
    el.className='fab'+(k===t?t==='sand'?' sand-on':t==='mark'?' mark-on':' on':'');
  });
  MAP.classList.toggle('no-drag',t!=='pan');
  if(t!=='place')placing=null;
  if(t==='edit'&&!active&&bases.length)active=bases[bases.length-1];
  refreshSidebar();updateBadge();draw();
}

function onFbPlace(){
  if(window.innerWidth<=640){showSheet('new',Array.from(document.querySelectorAll('.tab-btn'))[0]);}
  else{const i=document.getElementById('nameIn');if(i){i.focus();i.select();}}
}

// ═══════════════════════════════════════════════════
// KEY / GEOMETRY HELPERS
// ═══════════════════════════════════════════════════
const K=(x,z)=>`${x},${z}`;
const UK=s=>s.split(',').map(Number);
const PX=cx=>Math.floor(panX+cx*TILE*scale);
const PZ=cz=>Math.floor(panY+cz*TILE*scale);
const PW=cx=>PX(cx+1)-PX(cx);
const PH=cz=>PZ(cz+1)-PZ(cz);

function adj(cx,cz,set){return set.has(K(cx-1,cz))||set.has(K(cx+1,cz))||set.has(K(cx,cz-1))||set.has(K(cx,cz+1));}
function connected(set){
  if(set.size<=1)return true;
  const sv=set.values().next().value,vis=new Set([sv]),q=[sv];
  while(q.length){const[x,z]=UK(q.shift());for(const[nx,nz]of[[x-1,z],[x+1,z],[x,z-1],[x,z+1]]){const k=K(nx,nz);if(set.has(k)&&!vis.has(k)){vis.add(k);q.push(k);}}}
  return vis.size===set.size;
}
function tooClose(cx,cz,ownId){
  for(const b of bases){if(b.id===ownId)continue;for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)if(b.chunks.has(K(cx+dx,cz+dz)))return true;}
  return false;
}
function borderCount(cx,cz){let n=0;if(cx<BZONE)n++;if(cx>=CW-BZONE)n++;if(cz<BZONE)n++;if(cz>=CH-BZONE)n++;return n;}
const maxC=(cx,cz)=>{const b=borderCount(cx,cz);return b>=2?25:b===1?36:49;};

const PRICES=[0,0,1000,2828,5196,8000,11180,14697,18520,22627,27000,31623,36483,41569,46872,52383,58095,64000,70093,76368,82819,89443,96234,103189,110304,117576];
for(let n=26;n<=49;n++)PRICES.push(Math.round(Math.pow(n-1,1.5)*200)*5);
const totalCost=n=>{let t=0;for(let i=1;i<=Math.min(n,PRICES.length-1);i++)t+=PRICES[i];return t;};
const nextCost=n=>{const i=n+1;return i<PRICES.length?PRICES[i]:PRICES[PRICES.length-1];};
const fmt=n=>{if(n===0)return'Free';if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace(/\.0$/,'')+'k';return''+n;};

// ═══════════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════════
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const ts=TILE*scale,mw=CW*ts,mh=CH*ts;
  const x0=Math.max(0,Math.floor(-panX/ts)),z0=Math.max(0,Math.floor(-panY/ts));
  const x1=Math.min(CW,Math.ceil((cv.width-panX)/ts)),z1=Math.min(CH,Math.ceil((cv.height-panY)/ts));

  // Map bg — pure white canvas
  ctx.fillStyle='#ffffff';
  ctx.fillRect(panX,panY,mw,mh);

  // Border zone — very light tint
  const bz=BZONE*ts;
  ctx.fillStyle='#fff5f5';
  ctx.fillRect(panX,panY,mw,bz);ctx.fillRect(panX,panY+mh-bz,mw,bz);
  ctx.fillRect(panX,panY,bz,mh);ctx.fillRect(panX+mw-bz,panY,bz,mh);

  // Minor grid
  ctx.strokeStyle='#ebebeb';ctx.lineWidth=1;
  for(let i=x0;i<=x1;i++){const p=PX(i);ctx.beginPath();ctx.moveTo(p,PZ(z0));ctx.lineTo(p,PZ(z1));ctx.stroke();}
  for(let i=z0;i<=z1;i++){const p=PZ(i);ctx.beginPath();ctx.moveTo(PX(x0),p);ctx.lineTo(PX(x1),p);ctx.stroke();}
  // Major grid every 10
  ctx.strokeStyle='#d5d5d5';
  for(let i=Math.floor(x0/10)*10;i<=x1;i+=10){const p=PX(i);ctx.beginPath();ctx.moveTo(p,PZ(z0));ctx.lineTo(p,PZ(z1));ctx.stroke();}
  for(let i=Math.floor(z0/10)*10;i<=z1;i+=10){const p=PZ(i);ctx.beginPath();ctx.moveTo(PX(x0),p);ctx.lineTo(PX(x1),p);ctx.stroke();}

  // Buffer zone (while editing)
  if(placing||activeTool==='edit'){
    const ownId=active?active.id:null;
    for(const b of bases){
      if(b.id===ownId)continue;
      for(const k of b.chunks){
        const[cx,cz]=UK(k);
        for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){
          if(!dx&&!dz)continue;
          const nx=cx+dx,nz=cz+dz;
          if(nx<0||nx>=CW||nz<0||nz>=CH)continue;
          if(b.chunks.has(K(nx,nz)))continue;
          if(ownId&&active&&active.chunks.has(K(nx,nz)))continue;
          if(!bases.some(bb=>bb.id!==b.id&&bb.chunks.has(K(nx,nz)))){
            ctx.fillStyle='#fce8e8';ctx.fillRect(PX(nx),PZ(nz),PW(nx),PH(nz));
          }
        }
      }
    }
  }

  // ── PASS 1: base fills ──
  for(const b of bases){
    const dr=parseInt(b.color.slice(1,3),16),dg=parseInt(b.color.slice(3,5),16),db=parseInt(b.color.slice(5,7),16);
    const fill=`rgb(${Math.round(dr*.18+255*.82)},${Math.round(dg*.18+255*.82)},${Math.round(db*.18+255*.82)})`;
    for(const k of b.chunks){
      const[cx,cz]=UK(k);
      ctx.fillStyle=fill;ctx.fillRect(PX(cx),PZ(cz),PW(cx),PH(cz));
    }
  }

  // ── PASS 2: base borders (fillRect strips, pixel-perfect) ──
  const owner=new Map();
  for(const b of bases)for(const k of b.chunks)owner.set(k,b.id);
  const BW=Math.max(1,Math.min(3,Math.round(scale*1.2)));

  for(const b of bases){
    ctx.fillStyle=b.color;
    for(const k of b.chunks){
      const[cx,cz]=UK(k);
      const x1=PX(cx),y1=PZ(cz),x2=PX(cx+1),y2=PZ(cz+1);
      const w=x2-x1,h=y2-y1;if(w<=0||h<=0)continue;
      const bw=Math.min(BW,Math.floor(w/2),Math.floor(h/2));
      const nT=owner.get(K(cx,cz-1)),nB=owner.get(K(cx,cz+1));
      const nL=owner.get(K(cx-1,cz)),nR=owner.get(K(cx+1,cz));
      if(!nT||nT===b.id)ctx.fillRect(x1,y1,w,bw);
      if(!nB||nB===b.id)ctx.fillRect(x1,y2-bw,w,bw);
      if(!nL||nL===b.id)ctx.fillRect(x1,y1,bw,h);
      if(!nR||nR===b.id)ctx.fillRect(x2-bw,y1,bw,h);
    }
    // Chest square
    const cpx=PX(b.chX)+PW(b.chX)/2,cpz=PZ(b.chZ)+PH(b.chZ)/2;
    const cr=Math.max(3,Math.min(8,TILE*scale*.3));
    ctx.fillStyle=b.color;
    ctx.fillRect(Math.round(cpx-cr),Math.round(cpz-cr),Math.round(cr*2),Math.round(cr*2));
    // Name label
    if(scale>0.6){
      const fs=Math.max(9,Math.min(13,TILE*scale*.48));
      ctx.font=`600 ${fs}px Inter,sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      const tw=ctx.measureText(b.name).width+10;
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.fillRect(Math.round(cpx-tw/2),Math.round(cpz-cr-fs-3),Math.round(tw),Math.round(fs+3));
      ctx.fillStyle=b.color;
      ctx.fillText(b.name,cpx,cpz-cr-2);
      ctx.textBaseline='alphabetic';
    }
  }

  // ── SANDWALL ──
  for(const k of sandwalls){
    const[cx,cz]=UK(k);
    const sx=PX(cx),sy=PZ(cz),sw=PW(cx),sh=PH(cz);
    if(sw<=0||sh<=0)continue;
    ctx.fillStyle='#f5e9d0';ctx.fillRect(sx,sy,sw,sh);
    // diagonal stripe hatch
    ctx.save();ctx.beginPath();ctx.rect(sx,sy,sw,sh);ctx.clip();
    ctx.strokeStyle='#c9934a';ctx.lineWidth=1.2;
    const step=Math.max(5,sw/2.5);
    for(let s=-(sh+sw);s<sw+sh+sw;s+=step){
      ctx.beginPath();ctx.moveTo(sx+s,sy);ctx.lineTo(sx+s+sh*1.2,sy+sh);ctx.stroke();
    }
    ctx.restore();
    // border strips
    const sb=Math.max(1,Math.min(2,Math.round(scale)));
    ctx.fillStyle='#c9934a';
    ctx.fillRect(sx,sy,sw,sb);           // top
    ctx.fillRect(sx,sy+sh-sb,sw,sb);     // bottom
    ctx.fillRect(sx,sy,sb,sh);           // left
    ctx.fillRect(sx+sw-sb,sy,sb,sh);     // right
  }

  // ── MARKERS ──
  if(markers.length&&scale>0.28){
    for(const m of markers){
      const cpx=PX(m.cx)+PW(m.cx)/2;
      const cpy=PZ(m.cz)+PH(m.cz)/2;
      const fs=Math.max(11,Math.min(20,TILE*scale*.65));
      // emoji centered in chunk
      ctx.font=`${fs}px sans-serif`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(m.emoji,cpx,cpy);
      // label below
      if(scale>0.75&&m.label){
        const lfs=Math.max(8,Math.min(11,TILE*scale*.36));
        ctx.font=`600 ${lfs}px Inter,sans-serif`;
        ctx.textBaseline='top';
        const tw=ctx.measureText(m.label).width+8;
        const lx=Math.round(cpx-tw/2);
        const ly=Math.round(cpy+fs/2+3);
        ctx.fillStyle='rgba(15,15,17,.88)';
        if(ctx.roundRect){ctx.beginPath();ctx.roundRect(lx,ly,Math.round(tw),lfs+4,3);ctx.fill();}
        else{ctx.fillRect(lx,ly,Math.round(tw),lfs+4);}
        ctx.fillStyle='#fff';
        ctx.fillText(m.label,cpx,ly+2);
        ctx.textBaseline='alphabetic';
      }
    }
    ctx.textBaseline='alphabetic';
  }

  // ── HOVER HIGHLIGHT ──
  if(hcx>=0&&hcz>=0){
    const k=K(hcx,hcz);
    if(placing){
      const bad=bases.some(b=>b.chunks.has(k))||tooClose(hcx,hcz,null);
      ctx.fillStyle=bad?'#fee2e2':'#fef9c3';
      ctx.fillRect(PX(hcx),PZ(hcz),PW(hcx),PH(hcz));
      ctx.strokeStyle=bad?'#ef4444':'#f59e0b';ctx.lineWidth=2;
      ctx.strokeRect(PX(hcx)+1,PZ(hcz)+1,PW(hcx)-2,PH(hcz)-2);
    } else if(activeTool==='edit'&&active){
      const has=active.chunks.has(k);
      const full=active.chunks.size>=maxC(active.chX,active.chZ);
      const can=!full&&adj(hcx,hcz,active.chunks)&&!tooClose(hcx,hcz,active.id);
      const dr=parseInt(active.color.slice(1,3),16),dg=parseInt(active.color.slice(3,5),16),db=parseInt(active.color.slice(5,7),16);
      ctx.fillStyle=has?'#fee2e2':can?`rgb(${Math.round(dr*.3+255*.7)},${Math.round(dg*.3+255*.7)},${Math.round(db*.3+255*.7)})`:'#fce8e8';
      ctx.fillRect(PX(hcx),PZ(hcz),PW(hcx),PH(hcz));
      ctx.strokeStyle=has?'#ef4444':can?active.color:'#fca5a5';ctx.lineWidth=2;
      ctx.strokeRect(PX(hcx)+1,PZ(hcz)+1,PW(hcx)-2,PH(hcz)-2);
    } else if(activeTool==='sand'){
      const hasSand=sandwalls.has(k);
      ctx.fillStyle=hasSand?'#fee2e2':'rgba(201,147,74,.2)';
      ctx.fillRect(PX(hcx),PZ(hcz),PW(hcx),PH(hcz));
      ctx.strokeStyle=hasSand?'#ef4444':'#c9934a';ctx.lineWidth=2;
      ctx.strokeRect(PX(hcx)+1,PZ(hcz)+1,PW(hcx)-2,PH(hcz)-2);
    } else if(activeTool==='mark'){
      ctx.fillStyle='rgba(99,102,241,.12)';
      ctx.fillRect(PX(hcx),PZ(hcz),PW(hcx),PH(hcz));
      ctx.strokeStyle='#6366f1';ctx.lineWidth=2;
      ctx.strokeRect(PX(hcx)+1,PZ(hcz)+1,PW(hcx)-2,PH(hcz)-2);
    }
  }

  updateRing();
}

function updateRing(){
  const ts=TILE*scale,r=document.getElementById('ring');
  r.style.cssText=`left:${panX}px;top:${panY}px;width:${CW*ts}px;height:${CH*ts}px`;
}

// ═══════════════════════════════════════════════════
// SIDEBAR / BADGE
// ═══════════════════════════════════════════════════
function acardHTML(){
  if(!active)return'';
  const max=maxC(active.chX,active.chZ),used=active.chunks.size,left=max-used;
  const bn=borderCount(active.chX,active.chZ);
  const loc=bn>=2?'2 borders':bn===1?'1 border':'Open';
  const nc=left>0?nextCost(used):null;
  const lc=left>5?'g':left>0?'a':'r';
  return`<div class="acard">
    <div class="acard-head">
      <div class="acard-dot" style="background:${active.color}"></div>
      <div class="acard-name">${active.name}</div>
    </div>
    <div class="acard-body">
      <div class="srow"><span>Chunks</span><span>${used} / ${max}</span></div>
      <div class="srow"><span>Remaining</span><span><span class="pill ${lc}">${left} left</span></span></div>
      <div class="srow"><span>Spent</span><span>${fmt(totalCost(used))} coins</span></div>
      ${nc!=null?`<div class="srow"><span>Next chunk</span><span><span class="pill a">${fmt(nc)}</span></span></div>`:''}
      <div class="srow"><span>Location</span><span><span class="pill ${bn>0?'r':'g'}">${loc}</span></span></div>
    </div>
    <div class="acard-act">
      <button class="btn ghost" onclick="deselect()" style="font-size:11px">Done</button>
      <button class="btn danger" onclick="deleteActive()" style="font-size:11px">Delete</button>
    </div>
  </div>`;
}

function baseListHTML(){
  if(!bases.length)return'<div class="empty">No bases yet</div>';
  return bases.map(b=>{
    const max=maxC(b.chX,b.chZ),bn=borderCount(b.chX,b.chZ);
    const lc=bn>=2?'r':bn===1?'a':'g';
    const loc=bn>=2?'2B':bn===1?'1B':'Open';
    const sel=active&&active.id===b.id?' sel':'';
    return`<div class="brow${sel}" onclick="selectBase('${b.id}')">
      <div class="brow-strip" style="background:${b.color}"></div>
      <div class="brow-info">
        <div class="brow-name" style="color:${b.color}">${b.name}</div>
        <div class="brow-pills">
          <span class="pill p">${b.chunks.size}/${max}</span>
          <span class="pill ${lc}">${loc}</span>
          <span class="pill s">${fmt(totalCost(b.chunks.size))}</span>
        </div>
      </div>
      <div class="brow-del" onclick="event.stopPropagation();removeBase('${b.id}')">×</div>
    </div>`;
  }).join('');
}

function refreshSidebar(){
  const da=document.getElementById('d-active');
  if(active){da.style.display='';const ac=document.getElementById('d-acard');if(ac)ac.innerHTML=acardHTML();}
  else da.style.display='none';
  const dl=document.getElementById('d-list');if(dl)dl.innerHTML=baseListHTML();
  updateBadge();
}

function updateBadge(){
  const b=document.getElementById('chip-mode');if(!b)return;
  if(placing){b.style.color='#fb923c';b.textContent='Click to place chest';}
  else if(activeTool==='edit'&&active){
    b.style.color=active.color;
    const l=maxC(active.chX,active.chZ)-active.chunks.size;
    b.textContent=`${active.name} · L=claim  R=remove  (${l} left)`;
  }
  else if(activeTool==='sand'){b.style.color='#c9934a';b.textContent='Sandwall · L=add  R=remove';}
  else if(activeTool==='mark'){b.style.color='#818cf8';b.textContent='Marker · L=place  R=remove';}
  else{b.style.color='var(--sub)';b.textContent='Pan & zoom';}
}

// ═══════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════
function startChest(){
  const name=(document.getElementById('nameIn').value.trim()||`Base ${bases.length+1}`).slice(0,16);
  placing={name,color:selCol};active=null;
  activeTool='place';
  Object.entries(TOOL_IDS).forEach(([k,id])=>{const el=document.getElementById(id);if(el)el.className='fab'+(k==='place'?' on':'');});
  MAP.classList.add('no-drag');
  refreshSidebar();updateBadge();draw();
}
function deselect(){active=null;placing=null;setTool('pan');}
function deleteActive(){if(!active)return;bases=bases.filter(b=>b.id!==active.id);active=null;placing=null;setTool('pan');}
function removeBase(id){
  bases=bases.filter(b=>b.id!==id);
  if(active&&active.id===id){active=null;setTool('pan');}else{refreshSidebar();draw();}
}
function selectBase(id){
  const b=bases.find(b=>b.id===id);if(!b)return;
  active=b;placing=null;
  MAP.classList.add('no-drag');
  const ts=TILE*scale;panX=cv.width/2-(b.chX+.5)*ts;panY=cv.height/2-(b.chZ+.5)*ts;
  if(activeTool==='pan')setTool('edit');else{refreshSidebar();updateBadge();draw();}
}

// ═══════════════════════════════════════════════════
// ANIMATIONS
// ═══════════════════════════════════════════════════
const anims=[];
function spawnRemoveAnim(cx,cz,color){
  const cpx=PX(cx)+PW(cx)/2,cpz=PZ(cz)+PH(cz)/2;
  const particles=[];
  for(let i=0;i<16;i++){
    const angle=(i/16)*Math.PI*2+Math.random()*.3,speed=1.5+Math.random()*3;
    particles.push({x:cpx,y:cpz,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,size:2+Math.random()*4,color,life:0,maxLife:22+Math.floor(Math.random()*12)});
  }
  anims.push({type:'burst',particles,done:false});runAnims();
}
function spawnAddAnim(cx,cz,color){
  anims.push({type:'pulse',cx,cz,color,t:0,maxT:18,done:false});runAnims();
}
let animRaf=null;
function runAnims(){if(animRaf)return;animRaf=requestAnimationFrame(stepAnims);}
function stepAnims(){
  animRaf=null;let any=false;draw();
  for(const a of anims){
    if(a.done)continue;any=true;
    if(a.type==='burst'){
      let alive=false;
      for(const p of a.particles){
        if(p.life>=p.maxLife)continue;alive=true;
        p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.88;p.vy*=.88;p.life++;
        const fade=1-p.life/p.maxLife;
        const dr=parseInt(p.color.slice(1,3),16),dg=parseInt(p.color.slice(3,5),16),db=parseInt(p.color.slice(5,7),16);
        ctx.fillStyle=`rgb(${Math.round(dr+(255-dr)*(1-fade))},${Math.round(dg+(255-dg)*(1-fade))},${Math.round(db+(255-db)*(1-fade))})`;
        const s=Math.ceil(p.size*(1-p.life/p.maxLife*.5));
        ctx.fillRect(Math.round(p.x-s/2),Math.round(p.y-s/2),s,s);
      }
      if(!alive)a.done=true;
    }
    if(a.type==='pulse'){
      a.t++;if(a.t>=a.maxT){a.done=true;continue;}
      const prog=a.t/a.maxT,ts=TILE*scale;
      const x=PX(a.cx),z=PZ(a.cz),w=PW(a.cx),h=PH(a.cz);
      const expand=prog*ts*.5;
      const dr=parseInt(a.color.slice(1,3),16),dg=parseInt(a.color.slice(3,5),16),db=parseInt(a.color.slice(5,7),16);
      const fade=1-prog;
      ctx.strokeStyle=`rgb(${Math.round(dr+(255-dr)*(1-fade))},${Math.round(dg+(255-dg)*(1-fade))},${Math.round(db+(255-db)*(1-fade))})`;
      ctx.lineWidth=Math.max(1,(1-prog)*3);
      ctx.strokeRect(x-expand,z-expand,w+expand*2,h+expand*2);
    }
  }
  for(let i=anims.length-1;i>=0;i--)if(anims[i].done)anims.splice(i,1);
  if(any)animRaf=requestAnimationFrame(stepAnims);
}

// ═══════════════════════════════════════════════════
// TAP / CLICK HANDLER
// ═══════════════════════════════════════════════════
function handleTap(cx,cz,isRight){
  const k=K(cx,cz);

  if(placing&&!isRight){
    if(bases.some(b=>b.chunks.has(k))||tooClose(cx,cz,null))return;
    const nb={id:''+Date.now(),name:placing.name,color:placing.color,chX:cx,chZ:cz,chunks:new Set([k])};
    bases.push(nb);active=nb;placing=null;
    const inp=document.getElementById('nameIn');if(inp)inp.value='';
    activeTool='edit';
    Object.entries(TOOL_IDS).forEach(([k2,id])=>{const el=document.getElementById(id);if(el)el.className='fab'+(k2==='edit'?' on':'');});
    spawnAddAnim(cx,cz,nb.color);refreshSidebar();updateBadge();return;
  }

  if(activeTool==='edit'&&active){
    if(isRight){
      // Right-click: remove chunk
      if(!active.chunks.has(k))return;
      if(cx===active.chX&&cz===active.chZ)return;
      const t=new Set(active.chunks);t.delete(k);
      if(t.size>0&&!connected(t))return;
      const col=active.color;active.chunks.delete(k);
      spawnRemoveAnim(cx,cz,col);
    } else {
      // Left-click: claim chunk
      if(active.chunks.size>=maxC(active.chX,active.chZ))return;
      if(!adj(cx,cz,active.chunks)||tooClose(cx,cz,active.id))return;
      if(active.chunks.has(k))return;
      active.chunks.add(k);spawnAddAnim(cx,cz,active.color);
    }
    refreshSidebar();updateBadge();return;
  }

  if(activeTool==='sand'){
    if(isRight) sandwalls.delete(k);
    else sandwalls.add(k);
    draw();return;
  }

  if(activeTool==='mark'){
    if(isRight){
      const idx=markers.findIndex(m=>m.cx===cx&&m.cz===cz);
      if(idx>=0){markers.splice(idx,1);draw();}
    } else {
      const idx=markers.findIndex(m=>m.cx===cx&&m.cz===cz);
      openMarkerEdit(cx,cz,idx);
    }
    return;
  }
}

// ═══════════════════════════════════════════════════
// MARKER EDITOR
// ═══════════════════════════════════════════════════
let _pendingEmoji='📍';
function openMarkerEdit(cx,cz,existIdx){
  const ex=existIdx>=0?markers[existIdx]:null;
  _pendingEmoji=ex?ex.emoji:'📍';
  document.getElementById('m-title').textContent=ex?'Edit Marker':'New Marker';
  document.getElementById('m-sub').textContent=`X${(cx-CW/2)*16} Z${(cz-CH/2)*16}`;
  document.getElementById('m-body').innerHTML=`
    <div style="margin-bottom:12px">
      <div class="s-lbl" style="margin-bottom:7px">Emoji</div>
      <div class="epick" id="epick">
        ${MARKER_EMOJIS.map(e=>`<button onclick="pickE(this,'${e}')" class="${e===_pendingEmoji?'on':''}" data-e="${e}">${e}</button>`).join('')}
      </div>
    </div>
    <div class="s-lbl" style="margin-bottom:6px">Label</div>
    <input id="mLabel" class="field" type="text" maxlength="20" placeholder="Optional label…" value="${ex?ex.label:''}" style="margin-bottom:${ex?'8':'0'}px">
    ${ex?`<button class="btn danger" onclick="delMarker(${existIdx});closeModal()">Remove marker</button>`:''}`;
  const ok=document.getElementById('m-ok');ok.style.display='';ok.textContent=ex?'Save':'Add';
  ok.onclick=()=>{
    const lbl=(document.getElementById('mLabel').value||'').trim().slice(0,20);
    if(existIdx>=0){markers[existIdx]={...markers[existIdx],emoji:_pendingEmoji,label:lbl};}
    else markers.push({id:''+Date.now(),cx,cz,emoji:_pendingEmoji,label:lbl});
    closeModal();draw();
  };
  document.getElementById('overlay').classList.add('show');
}
function pickE(btn,e){
  _pendingEmoji=e;
  document.querySelectorAll('#epick button').forEach(b=>{b.classList.toggle('on',b.dataset.e===e);});
}
function delMarker(idx){markers.splice(idx,1);}

// ═══════════════════════════════════════════════════
// EXPORT / IMPORT
// ═══════════════════════════════════════════════════
function doExport(){
  const payload={
    bases:bases.map(b=>({n:b.name,c:b.color,x:b.chX,z:b.chZ,ch:[...b.chunks]})),
    sand:[...sandwalls],
    marks:markers.map(m=>({id:m.id,x:m.cx,z:m.cz,e:m.emoji,l:m.label}))
  };
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  document.getElementById('m-title').textContent='Map code';
  document.getElementById('m-sub').textContent=
    [bases.length&&`${bases.length} base${bases.length!==1?'s':''}`,
     sandwalls.size&&`${sandwalls.size} sandwall chunk${sandwalls.size!==1?'s':''}`,
     markers.length&&`${markers.length} marker${markers.length!==1?'s':''}`]
    .filter(Boolean).join(' · ')||'Empty map';
  document.getElementById('m-body').innerHTML=`<div class="code-box">${code}</div>`;
  const ok=document.getElementById('m-ok');ok.style.display='';ok.textContent='Copy';
  ok.onclick=()=>{navigator.clipboard.writeText(code).then(()=>{ok.textContent='Copied!';setTimeout(()=>ok.textContent='Copy',1500);}).catch(()=>{});};
  document.getElementById('overlay').classList.add('show');
}
function openImport(){
  document.getElementById('m-title').textContent='Import map';
  document.getElementById('m-sub').textContent='Paste map code. Replaces all current data.';
  document.getElementById('m-body').innerHTML=`<textarea class="code-box" id="importCode" placeholder="Paste code here…"></textarea>`;
  const ok=document.getElementById('m-ok');ok.style.display='';ok.textContent='Import';ok.onclick=doImport;
  document.getElementById('overlay').classList.add('show');
}
function doImport(){
  const raw=(document.getElementById('importCode').value||'').trim();
  try{
    const p=JSON.parse(decodeURIComponent(escape(atob(raw))));
    const payload=Array.isArray(p)?{bases:p,sand:[],marks:[]}:p;
    if(!Array.isArray(payload.bases))throw 0;
    bases=payload.bases.map((d,i)=>({id:Date.now()+i+'',name:d.n||'Base',color:d.c||'#8b5cf6',chX:+d.x,chZ:+d.z,chunks:new Set(d.ch)}));
    sandwalls.clear();(payload.sand||[]).forEach(k=>sandwalls.add(k));
    markers=(payload.marks||[]).map(m=>({id:m.id||''+Date.now(),cx:+m.x,cz:+m.z,emoji:m.e||'📍',label:m.l||''}));
    active=null;placing=null;closeModal();setTool('pan');
    if(bases.length){
      let minX=CW,maxX=0,minZ=CH,maxZ=0;
      for(const b of bases)for(const k of b.chunks){const[cx,cz]=UK(k);minX=Math.min(minX,cx);maxX=Math.max(maxX,cx);minZ=Math.min(minZ,cz);maxZ=Math.max(maxZ,cz);}
      const sp=Math.max(maxX-minX+4,maxZ-minZ+4);
      scale=Math.min(cv.width/(sp*TILE),cv.height/(sp*TILE),10)*.85;
      panX=cv.width/2-((minX+maxX)/2+.5)*TILE*scale;panY=cv.height/2-((minZ+maxZ)/2+.5)*TILE*scale;
    }
    refreshSidebar();draw();
  }catch{const ta=document.getElementById('importCode');ta.classList.add('err');ta.placeholder='Invalid code';ta.value='';}
}

function showModal(t,s,ok,fn){
  document.getElementById('m-title').textContent=t;document.getElementById('m-sub').textContent=s;
  document.getElementById('m-body').innerHTML='';
  const mok=document.getElementById('m-ok');mok.style.display='';mok.textContent=ok;mok.onclick=fn;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){document.getElementById('overlay').classList.remove('show');document.getElementById('m-ok').style.display='';}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

function openColorPicker(){
  document.getElementById('m-title').textContent='Base color';
  document.getElementById('m-sub').textContent='Color for new bases.';
  document.getElementById('m-body').innerHTML='<div class="swatches" id="modal-sw" style="gap:7px"></div>';
  buildSwatches('modal-sw');
  const ok=document.getElementById('m-ok');ok.style.display='';ok.textContent='Done';ok.onclick=closeModal;
  document.getElementById('overlay').classList.add('show');
}
function openMore(){
  document.getElementById('m-title').textContent='Options';
  document.getElementById('m-sub').textContent='';
  document.getElementById('m-body').innerHTML=
    `<button class="btn" onclick="doExport();closeModal()">Export map code</button>`+
    `<button class="btn" onclick="closeModal();openImport()">Import map code</button>`+
    (active?`<button class="btn ghost" onclick="deselect();closeModal()">Deselect base</button><button class="btn danger" onclick="deleteActive();closeModal()">Delete active base</button>`:'');
  document.getElementById('m-ok').style.display='none';
  document.getElementById('overlay').classList.add('show');
}

// ═══════════════════════════════════════════════════
// MOBILE SHEET
// ═══════════════════════════════════════════════════
let sheetOpen=false;
const sheet=document.getElementById('sheet');
sheet.style.transform='translateY(calc(100% - 56px))';
function showSheet(t,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
  else{const tabs=Array.from(document.querySelectorAll('.tab-btn'));const idx={new:0,active:1,bases:2,save:3};const i=idx[t];if(i!=null&&tabs[i])tabs[i].classList.add('on');}
  const body=document.getElementById('sh-body');
  if(t==='new'){
    body.innerHTML=`<div class="s-lbl">New Base</div><input id="m-nameIn" class="field" type="text" placeholder="Base name" maxlength="16"><div class="swatches" id="m-sw" style="margin-bottom:10px"></div><button class="btn accent" onclick="startChestMobile()" style="justify-content:center">Place Claim Chest</button>`;
    buildSwatches('m-sw');
  }else if(t==='active'){
    body.innerHTML=active?`<div class="s-lbl">Active Base</div>${acardHTML()}`:`<div class="empty" style="margin-top:8px">No active base</div>`;
  }else if(t==='bases'){
    body.innerHTML=`<div class="s-lbl">Bases</div>${baseListHTML()}`;
  }else if(t==='save'){
    body.innerHTML=`<div class="s-lbl">Save &amp; Load</div><button class="btn" onclick="doExport()">Export code</button><button class="btn" onclick="openImport()">Import code</button>`;
  }
  if(!sheetOpen){sheetOpen=true;sheet.style.transform='translateY(0)';}
}
function startChestMobile(){
  const inp=document.getElementById('m-nameIn');
  placing={name:(inp?inp.value.trim():'')||`Base ${bases.length+1}`,color:selCol};active=null;activeTool='place';
  Object.entries(TOOL_IDS).forEach(([k,id])=>{const el=document.getElementById(id);if(el)el.className='fab'+(k==='place'?' on':'');});
  MAP.classList.add('no-drag');
  sheet.style.transform='translateY(calc(100% - 56px))';sheetOpen=false;
  refreshSidebar();updateBadge();draw();
}
let shY=0,shDrag=false,shStart=0;
document.getElementById('sh-handle').addEventListener('touchstart',e=>{shDrag=true;shStart=e.touches[0].clientY;shY=sheetOpen?0:sheet.offsetHeight-56;},{passive:true});
window.addEventListener('touchmove',e=>{if(!shDrag)return;const ny=Math.max(0,Math.min(sheet.offsetHeight-56,shY+e.touches[0].clientY-shStart));sheet.style.transition='none';sheet.style.transform=`translateY(${ny}px)`;},{passive:true});
window.addEventListener('touchend',()=>{if(!shDrag)return;shDrag=false;const cur=parseFloat(sheet.style.transform.replace(/[^0-9.-]/g,''))||0;sheetOpen=cur<sheet.offsetHeight/2;sheet.style.transition='transform .25s ease';sheet.style.transform=sheetOpen?'translateY(0)':`translateY(calc(100% - 56px))`;shY=sheetOpen?0:sheet.offsetHeight-56;});

// ═══════════════════════════════════════════════════
// MOUSE EVENTS
// ═══════════════════════════════════════════════════
MAP.addEventListener('mousedown',e=>{
  if(e.button===2)return; // right-click handled by contextmenu
  lx=e.clientX;ly=e.clientY;
  if(activeTool==='pan'&&!placing)dragging=true;
});
window.addEventListener('mouseup',()=>dragging=false);

MAP.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const r=MAP.getBoundingClientRect(),ts=TILE*scale;
  const cx=Math.floor((e.clientX-r.left-panX)/ts),cz=Math.floor((e.clientY-r.top-panY)/ts);
  if(cx>=0&&cx<CW&&cz>=0&&cz<CH)handleTap(cx,cz,true);
});

MAP.addEventListener('click',e=>{
  const r=MAP.getBoundingClientRect(),ts=TILE*scale;
  const cx=Math.floor((e.clientX-r.left-panX)/ts),cz=Math.floor((e.clientY-r.top-panY)/ts);
  if(cx>=0&&cx<CW&&cz>=0&&cz<CH)handleTap(cx,cz,false);
});

window.addEventListener('mousemove',e=>{
  if(dragging){panX+=e.clientX-lx;panY+=e.clientY-ly;lx=e.clientX;ly=e.clientY;draw();}
  lx=e.clientX;ly=e.clientY;
  const r=MAP.getBoundingClientRect(),ts=TILE*scale;
  const rcx=(e.clientX-r.left-panX)/ts,rcz=(e.clientY-r.top-panY)/ts;
  const cx=Math.floor(rcx),cz=Math.floor(rcz),inM=cx>=0&&cx<CW&&cz>=0&&cz<CH;
  if(inM!==(hcx>=0)||cx!==hcx||cz!==hcz){hcx=inM?cx:-1;hcz=inM?cz:-1;if(!animRaf)draw();}
  document.getElementById('hx').textContent=Math.round((rcx-CW/2)*16);
  document.getElementById('hz').textContent=Math.round((rcz-CH/2)*16);
  const hint=document.getElementById('hint');
  if(active&&inM&&activeTool==='edit'){const l=maxC(active.chX,active.chZ)-active.chunks.size;hint.className=l>0?'a':'r';hint.textContent=`${l} left`;}
  else hint.textContent='';
  const tip=document.getElementById('tip');
  let hit=null;
  if(inM){
    const k=K(cx,cz);
    for(const b of bases){if(b.chunks.has(k)){const max=maxC(b.chX,b.chZ);hit=`<b style="color:${b.color}">${b.name}</b><br><span>${b.chunks.size}/${max} chunks · ${fmt(totalCost(b.chunks.size))} coins</span>`;break;}}
    if(!hit&&sandwalls.has(k))hit=`<span class="sand">Sandwall</span>`;
    if(!hit){const m=markers.find(m=>m.cx===cx&&m.cz===cz);if(m)hit=`${m.emoji}${m.label?` <b>${m.label}</b>`:''}`;}
  }
  if(hit){tip.style.display='block';tip.innerHTML=hit;const mr=MAP.getBoundingClientRect();tip.style.left=(e.clientX-mr.left+14)+'px';tip.style.top=(e.clientY-mr.top-8)+'px';}
  else tip.style.display='none';
});

MAP.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.1:.91,r=MAP.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  panX=mx-(mx-panX)*f;panY=my-(my-panY)*f;
  scale=Math.min(Math.max(scale*f,.05),16);draw();
},{passive:false});
function doZoom(f){panX=cv.width/2-(cv.width/2-panX)*f;panY=cv.height/2-(cv.height/2-panY)*f;scale=Math.min(Math.max(scale*f,.05),16);draw();}

// ═══════════════════════════════════════════════════
// TOUCH EVENTS (pinch + tap)
// ═══════════════════════════════════════════════════
let touchMoved=false,tSX=0,tSY=0;
MAP.addEventListener('touchstart',e=>{
  if(e.touches.length===1){pinching=false;tSX=e.touches[0].clientX;tSY=e.touches[0].clientY;lx=tSX;ly=tSY;touchMoved=false;}
  else if(e.touches.length===2){
    pinching=true;touchMoved=true;
    lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const r=MAP.getBoundingClientRect();
    pmx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
    pmy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
  }
},{passive:true});
MAP.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===2){
    pinching=true;touchMoved=true;
    const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const r=MAP.getBoundingClientRect();
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
    const my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    panX+=mx-pmx;panY+=my-pmy;
    const f=dist/lastDist;panX=mx-(mx-panX)*f;panY=my-(my-panY)*f;
    scale=Math.min(Math.max(scale*f,.05),16);lastDist=dist;pmx=mx;pmy=my;draw();
  }else if(e.touches.length===1&&!pinching){
    const dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;
    if(Math.abs(dx)>3||Math.abs(dy)>3)touchMoved=true;
    panX+=dx;panY+=dy;lx=e.touches[0].clientX;ly=e.touches[0].clientY;draw();
  }
},{passive:false});
MAP.addEventListener('touchend',e=>{
  if(e.touches.length===0)pinching=false;
  if(e.changedTouches.length===1&&!touchMoved&&!pinching){
    const r=MAP.getBoundingClientRect(),ts=TILE*scale;
    const cx=Math.floor((e.changedTouches[0].clientX-r.left-panX)/ts);
    const cz=Math.floor((e.changedTouches[0].clientY-r.top-panY)/ts);
    if(cx>=0&&cx<CW&&cz>=0&&cz<CH)handleTap(cx,cz,false);
  }
},{passive:true});

// ═══════════════════════════════════════════════════
// RESIZE / INIT
// ═══════════════════════════════════════════════════
function resize(){
  cv.width=MAP.clientWidth;cv.height=MAP.clientHeight;
  const fit=Math.min(cv.width/(CW*TILE),cv.height/(CH*TILE))*.88;
  scale=fit;panX=(cv.width-CW*TILE*scale)/2;panY=(cv.height-CH*TILE*scale)/2;draw();
}
resize();window.addEventListener('resize',resize);
showSheet('new',document.querySelector('.tab-btn'));
</script>
