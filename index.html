<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LSN Chunk Map</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0f0f11;--surface:#17171b;--card:#1e1e24;--border:#2a2a35;--border2:#222228;--text:#e8e8f0;--sub:#6b6b80;--muted:#3a3a48;--accent:#8b5cf6;--accent2:#7c3aed;--asoft:rgba(139,92,246,.15);--red:#f87171;--red2:#ef4444;--green:#4ade80;--orange:#fb923c;--sand:#c9934a;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;}

/* AUTH STYLES */
#auth-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.auth-logo{text-align:center;margin-bottom:24px;}
.auth-logo .brand{font-size:22px;font-weight:700;color:var(--accent);}
.auth-tabs{display:flex;background:var(--card);border-radius:9px;padding:3px;margin-bottom:20px;}
.auth-tab{flex:1;padding:7px;border-radius:7px;border:none;background:none;color:var(--sub);font-size:12px;font-weight:500;cursor:pointer;}
.auth-tab.on{background:var(--surface);color:var(--text);}
.auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.auth-field label{font-size:11px;color:var(--sub);}
.auth-field input{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 11px;outline:none;}
.auth-btn{width:100%;padding:10px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;}

/* APP LAYOUT */
#app{display:none;height:100%;position:relative;}
#layout{display:flex;height:100%;}
#side{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10;}
#side-scroll{flex:1;overflow-y:auto;padding:14px 12px;}
.s-lbl{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--sub);margin-bottom:9px;letter-spacing:1px;}
.field{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;margin-bottom:8px;outline:none;}
.swatches{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.sw{width:22px;height:22px;border-radius:5px;cursor:pointer;border:2px solid transparent;}
.sw.on{border-color:#fff;}
.btn{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;margin-bottom:5px;display:flex;align-items:center;gap:8px;justify-content:center;}
.btn.accent{background:var(--accent);border:none;color:white;}

/* MAP AREA */
#map-el{flex:1;position:relative;background:var(--bg);cursor:grab;overflow:hidden;touch-action:none;}
#cv-el{position:absolute;inset:0;image-rendering:pixelated;}
#user-chip{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(15,15,17,.8);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:8px;padding:6px 12px;display:flex;gap:10px;align-items:center;}
#tools-el{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;}
.fab{width:42px;height:42px;border-radius:11px;background:var(--surface);border:1px solid var(--border);color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.fab.on{background:var(--asoft);border-color:var(--accent);color:var(--accent);}
.hchip{position:absolute;bottom:20px;left:20px;background:rgba(0,0,0,0.5);padding:5px 10px;border-radius:5px;font-size:11px;}

/* ADMIN PANEL */
#admin-panel{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;flex-direction:column;padding:20px;}
.user-row{background:var(--surface);padding:10px;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}

@media(max-width:640px){ #side{display:none;} }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo"><div class="brand">LSN Chunk Map</div></div>
    <div class="auth-tabs">
      <button class="auth-tab on" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-reg" onclick="switchTab('register')">Register</button>
    </div>
    <div id="form-login">
      <div class="auth-field"><label>Email</label><input id="l-user" type="email"></div>
      <div class="auth-field"><label>Password</label><input id="l-pass" type="password"></div>
      <button class="auth-btn" onclick="doLogin()">Login</button>
    </div>
    <div id="form-reg" style="display:none">
      <div class="auth-field"><label>Email</label><input id="r-user" type="email"></div>
      <div class="auth-field"><label>Password</label><input id="r-pass" type="password"></div>
      <button class="auth-btn" onclick="doRegister()">Request Access</button>
    </div>
  </div>
</div>

<div id="app">
  <div id="user-chip">
    <span id="uc-name">Loading...</span>
    <button id="uc-admin-btn" style="display:none; color:var(--accent)" onclick="toggleAdmin(true)">Admin</button>
    <button onclick="doLogout()">Logout</button>
  </div>

  <div id="layout">
    <div id="side">
      <div id="side-scroll">
        <div class="s-lbl">New Base</div>
        <input id="nameIn" class="field" placeholder="Base name">
        <div class="swatches" id="d-sw"></div>
        <button class="btn accent" onclick="createBase()">Create Base</button>
        <div style="margin-top:20px">
          <div class="s-lbl">Bases</div>
          <div id="d-list"></div>
        </div>
      </div>
    </div>
    <div id="map-el">
      <canvas id="cv-el"></canvas>
      <div id="tools-el">
        <button class="fab on" id="btn-pan" onclick="setTool('pan')">Pan</button>
        <button class="fab" id="btn-edit" onclick="setTool('edit')">Claim</button>
        <button class="fab" id="btn-sand" onclick="setTool('sand')">Sand</button>
      </div>
      <div class="hchip">X: <span id="hx">0</span> Z: <span id="hz">0</span></div>
    </div>
  </div>
</div>

<div id="admin-panel">
  <div style="display:flex; justify-content:space-between; margin-bottom:20px">
    <h2>Admin Panel</h2>
    <button class="btn" style="width:100px" onclick="toggleAdmin(false)">Close</button>
  </div>
  <div id="admin-user-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCkcS23tW3hvcdCSCpBOy30EQVMxqYXEJQ",
  authDomain: "lsn-map.firebaseapp.com",
  projectId: "lsn-map",
  storageBucket: "lsn-map.firebasestorage.app",
  messagingSenderId: "520317481803",
  appId: "1:520317481803:web:ffcc027fd3be1984b22ece"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// STATE
let BASES = [];
let ACTIVE_ID = null;
let panX = window.innerWidth/2, panY = window.innerHeight/2, scale = 2;
let tool = 'pan';
let selColor = '#8b5cf6';
let isDragging = false;
let startX, startY;

// MAP RENDERING
const CV = document.getElementById('cv-el');
const CTX = CV.getContext('2d');
const TILE = 16;

function draw() {
  CV.width = window.innerWidth;
  CV.height = window.innerHeight;
  CTX.clearRect(0,0,CV.width, CV.height);
  const ts = TILE * scale;

  // Grid
  CTX.strokeStyle = '#1a1a20';
  for(let x=panX%ts; x<CV.width; x+=ts) { CTX.beginPath(); CTX.moveTo(x,0); CTX.lineTo(x,CV.height); CTX.stroke(); }
  for(let y=panY%ts; y<CV.height; y+=ts) { CTX.beginPath(); CTX.moveTo(0,y); CTX.lineTo(CV.width,y); CTX.stroke(); }

  // Bases
  BASES.forEach(b => {
    CTX.fillStyle = b.color;
    b.chunks?.forEach(c => {
      CTX.fillRect(panX + c.x*ts, panY + c.z*ts, ts, ts);
    });
    // Sandwalls
    CTX.strokeStyle = '#fb923c';
    b.sand?.forEach(s => {
      CTX.strokeRect(panX + s.x*ts+2, panY + s.z*ts+2, ts-4, ts-4);
    });
  });
  requestAnimationFrame(draw);
}

// INTERACTION
const MAP = document.getElementById('map-el');
MAP.addEventListener('mousedown', e => {
  if(tool === 'pan') { isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY; }
  else {
    const rect = MAP.getBoundingClientRect();
    const cx = Math.floor((e.clientX - rect.left - panX) / (TILE*scale));
    const cz = Math.floor((e.clientY - rect.top - panY) / (TILE*scale));
    handleClaim(cx, cz, e.button !== 0);
  }
});
window.addEventListener('mousemove', e => {
  if(isDragging) { panX = e.clientX - startX; panY = e.clientY - startY; }
  const rect = MAP.getBoundingClientRect();
  document.getElementById('hx').textContent = Math.floor((e.clientX - rect.left - panX) / (TILE*scale)) * 16;
  document.getElementById('hz').textContent = Math.floor((e.clientY - rect.top - panY) / (TILE*scale)) * 16;
});
window.addEventListener('mouseup', () => isDragging = false);
MAP.addEventListener('contextmenu', e => e.preventDefault());

// DATA LOGIC
async function handleClaim(x, z, remove) {
  if(!ACTIVE_ID) return alert("Select a base first");
  const base = BASES.find(b => b.id === ACTIVE_ID);
  const list = tool === 'sand' ? (base.sand || []) : (base.chunks || []);
  
  if(remove) {
    const idx = list.findIndex(c => c.x === x && c.z === z);
    if(idx > -1) list.splice(idx, 1);
  } else {
    if(!list.find(c => c.x === x && c.z === z)) list.push({x, z});
  }
  
  const update = tool === 'sand' ? {sand: list} : {chunks: list};
  await db.collection('bases').doc(ACTIVE_ID).update(update);
}

async function createBase() {
  const name = document.getElementById('nameIn').value || "Unnamed";
  const res = await db.collection('bases').add({
    name, color: selColor, chunks: [], sand: [], owner: auth.currentUser.uid
  });
  ACTIVE_ID = res.id;
  document.getElementById('nameIn').value = "";
}

function syncData() {
  db.collection('bases').onSnapshot(snap => {
    BASES = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
    renderSidebar();
  });
}

function renderSidebar() {
  const list = document.getElementById('d-list');
  list.innerHTML = "";
  BASES.forEach(b => {
    const item = document.createElement('div');
    item.className = "btn";
    if(b.id === ACTIVE_ID) item.style.borderColor = "var(--accent)";
    item.innerHTML = `<div style="width:10px;height:10px;background:${b.color}"></div> ${b.name}`;
    item.onclick = () => { ACTIVE_ID = b.id; renderSidebar(); };
    list.appendChild(item);
  });
}

// AUTH LOGIC
function switchTab(t) {
  document.getElementById('form-login').style.display = t === 'login' ? '' : 'none';
  document.getElementById('form-reg').style.display = t === 'register' ? '' : 'none';
}

async function doLogin() {
  try {
    const res = await auth.signInWithEmailAndPassword(document.getElementById('l-user').value, document.getElementById('l-pass').value);
    const doc = await db.collection('users').doc(res.user.uid).get();
    if(doc.data()?.status === 'approved' || res.user.email === 'riskx.xyz@gmail.com') {
      enterApp(doc.data()?.username, doc.data()?.role);
    } else { alert("Pending approval"); auth.signOut(); }
  } catch(e) { alert(e.message); }
}

async function doRegister() {
  try {
    const email = document.getElementById('r-user').value;
    const res = await auth.createUserWithEmailAndPassword(email, document.getElementById('r-pass').value);
    await db.collection('users').doc(res.user.uid).set({
      email, username: email.split('@')[0], status: 'pending', role: 'user'
    });
    alert("Request Sent!");
    auth.signOut();
  } catch(e) { alert(e.message); }
}

function enterApp(name, role) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('uc-name').textContent = name;
  if(role === 'admin' || auth.currentUser.email === 'riskx.xyz@gmail.com') document.getElementById('uc-admin-btn').style.display = 'block';
  syncData();
  requestAnimationFrame(draw);
}

function doLogout() { auth.signOut(); location.reload(); }

function setTool(t) {
  tool = t;
  document.querySelectorAll('.fab').forEach(b => b.classList.remove('on'));
  if(t === 'pan') document.getElementById('btn-pan').classList.add('on');
  if(t === 'edit') document.getElementById('btn-edit').classList.add('on');
  if(t === 'sand') document.getElementById('btn-sand').classList.add('on');
}

// ADMIN LOGIC
async function toggleAdmin(show) {
  document.getElementById('admin-panel').style.display = show ? 'flex' : 'none';
  if(show) {
    const snap = await db.collection('users').get();
    const list = document.getElementById('admin-user-list');
    list.innerHTML = "";
    snap.forEach(doc => {
      const u = doc.data();
      const row = document.createElement('div');
      row.className = "user-row";
      row.innerHTML = `<span>${u.email} (${u.status})</span> 
        <button class="btn" style="width:80px" onclick="approveUser('${doc.id}')">Approve</button>`;
      list.appendChild(row);
    });
  }
}

async function approveUser(id) {
  await db.collection('users').doc(id).update({status: 'approved'});
  toggleAdmin(true);
}

// Swatches Init
const colors = ['#8b5cf6','#ef4444','#4ade80','#fb923c','#c9934a'];
colors.forEach(c => {
  const s = document.createElement('div');
  s.className = 'sw';
  s.style.background = c;
  s.onclick = () => { selColor = c; document.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); s.classList.add('on'); };
  document.getElementById('d-sw').appendChild(s);
});

</script>
</body>
</html>
